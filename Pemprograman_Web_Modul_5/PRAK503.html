<!DOCTYPE html>
<html>
<body>
    <h1>Latihan JavaScript</h1>

    <p id="demo">
    JavaScript bisa merubah isi halaman HTML
    </p>

    <script>
        function myFunction()
        {
            x = document.getElementById("demo");
            x.style.color="#800000"; 

        }
    </script>

    <button type="button" onclick="myFunction()">Click Me!</button>

</body>
</html>
